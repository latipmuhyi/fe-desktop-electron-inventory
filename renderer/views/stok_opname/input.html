<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stok Opname</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/detail.css">
  </head>

  <body>
    <div class="header-pos">
      <div class="d-flex align-items-center">
        <div class="btn mx-2 btn-ssi" id="to-stok">
          <i class="fa-solid fa-arrow-left"></i>
        </div>
        <h2 class="text-ssi">SSI</h2>
        <div class="border-d"></div>
      </div>
    </div>

    <div class="container-fluid mt-3">
      <div class="row">
        <div>
          <div class="">
            <div class="d-flex gap-3 mb-3 w-50">
              <div class="input-group">
                <input type="text" class="form-control" id="scanBarcode" placeholder="Scan Barcode">
              </div>
              <button class="btn btn-ssi" type="button" id="addScanBtn">Tambah</button>
            </div>

            <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
              <table class="table table-sm table-hover table-pos mt-0 mb-0">
                <thead class="table-light" style="position: sticky; top: 0; background: white; z-index: 1;">
                  <tr style="white-space: nowrap;">
                    <th scope="col">No</th>
                    <th scope="col">Opname Number</th>
                    <th scope="col">Judul</th>
                    <th scope="col">Opname Date</th>
                    <th scope="col">Total Scanned</th>
                    <th scope="col">Total Matched</th>
                    <th scope="col">Total Unmatched</th>
                    <th scope="col">Status</th>
                    <th scope="col">Opsi</th>
                  </tr>
                </thead>
                <tbody id="tbody-right">
                  <tr>
                    <td colspan="9" class="text-center">Memuat data...</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <button class="btn btn-outline-dark float-end mt-2" id="btn-validate">Validate</button>
          </div>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="footer-pos mt-2">
      <div class="align-content-end">
        <!-- <button class="btn btn-outline-danger">Validate</button> -->
        <!-- <p class="mb-0">Subtotal: Rp 256,700</p>
        <p class="mb-0">Total: <span class="total">Rp 256,700</span></p> -->
      </div>
    </div>
  </body>
  <script src="../../js/input.js"></script>
  <script src="../../js/route.js"></script>
</html>
