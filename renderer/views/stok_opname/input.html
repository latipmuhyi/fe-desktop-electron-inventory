<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stok Opname</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/detail.css">
  </head>

  <body>
    <div class="header-pos">
      <div class="d-flex align-items-center">
        <div class="btn mx-2 btn-ssi" id="to-stok">
          <i class="fa-solid fa-arrow-left"></i>
        </div>
        <h2 class="text-ssi">SSI</h2>
        <div class="border-d"></div>
        <div>
          <table>
            <tr>
              <td>Warehouse</td>
              <td>:</td>
              <td id="head-warehouse">Memuat data...</td>
            </tr>
            <tr>
              <td>Tanggal</td>
              <td>:</td>
              <td id="head-date">Memuat data...</td>
            </tr>
          </table>
        </div>
      </div>
    </div>

    <div class="container-fluid mt-3">
      <div class="row">
        <div class="col-md-4 mb-5">
          <div class="panel-kanan">
            <div class="table-responsive" style="max-height: 550px; overflow-y: auto;">
              <table class="table table-sm table-bordered table-hover table-pos mt-0 mb-0">
                <thead class="table-light" style="position: sticky; top: 0; background: white; z-index: 1;">
                  <tr style="white-space: nowrap;">
                    <th>No</th>
                    <th>Barcode</th>
                    <th>Nama</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="tbody-left">
                  <tr>
                    <td colspan="4" class="text-center">Memuat data...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-md-8">
          <div class="">
            <div class="d-flex gap-3 mb-3 w-100">
              <div class="input-group">
                <input type="text" class="form-control" id="scanBarcode" placeholder="Scan Barcode">
                <select class="form-select" id="condition">
                  <option value="">Pilih Kondisi Barang</option>
                  <option value="good">Good</option>
                  <option value="damaged">Damaged</option>
                  <option value="missing_parts">Missing Parts</option>
                  <option value="defect">Defect</option>
                </select>
                <input type="text" class="form-control" id="information" placeholder="Informasi">
              </div>
              <button class="btn btn-ssi" type="button" id="addScanBtn">Tambah</button>
            </div>

            <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
              <table class="table table-sm table-hover table-pos mt-0 mb-0">
                <thead class="table-light" style="position: sticky; top: 0; background: white; z-index: 1;">
                  <tr style="white-space: nowrap;">
                    <th scope="col">No</th>
                    <th scope="col">Barcode</th>
                    <th scope="col">Product Name</th>
                    <th scope="col">Warehouse</th>
                    <th scope="col">Product Condition</th>
                    <th scope="col">information</th>
                    <th scope="col">Vendor</th>
                    <th scope="col">Receipt</th>
                    <th scope="col">Match Status</th>
                    <th scope="col">Tanggal</th>
                    <!-- <th scope="col">Opsi</th> -->
                  </tr>
                </thead>
                <tbody id="tbody-right">
                  <tr>
                    <td colspan="10" class="text-center">Memuat data...</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <button class="btn btn-outline-dark float-end mt-2" id="btn-validate">Validate</button>
          </div>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="footer-pos mt-2">
      <div class="align-content-end">
        <!-- <button class="btn btn-outline-danger">Validate</button> -->
        <!-- <p class="mb-0">Subtotal: Rp 256,700</p>
        <p class="mb-0">Total: <span class="total">Rp 256,700</span></p> -->
      </div>
    </div>
    <!-- ✅ Toast Sukses -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
      <div id="successToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body" id="success-message">Data Berhasil di Validate</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>

      <!-- ❌ Toast Error -->
      <div id="errorToast" class="toast align-items-center text-bg-danger border-0 mt-2" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body" id="error-message"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
  <script src="../../js/input.js"></script>
  <script src="../../js/route.js"></script>
  <script src="../../js/stok-opname/index.js"></script>
  <script src="../../../services/env.js"></script>
  <script src="../../js/loading.js"></script>
</html>
