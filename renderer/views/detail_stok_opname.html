<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stok Opname</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <div id="sidebar-container" class="col-md-3 col-lg-2 px-0"></div>
        <div class="col-md-9 col-lg-10 px-0">
          <div class="main-content p-4">
            <div class="d-flex align-items-center mb-4">
              <div class="btn mx-2 btn-ssi" id="to-stok-opname">
                <i class="fa-solid fa-arrow-left"></i>
              </div>
              <h3 class="me-3">Detail Stock Opname</h3>
            </div>
            <hr/>
            <div class="">
              <h5 class="mb-0">Data Stock Opname</h4>
            </div>
            <div class="table-responsive" style="max-height: 550px; overflow-y: auto;">
            <table class="table table-sm table-hover mt-0 mb-0">
              <thead class="table-light" style="position: sticky; top: 0; background: white; z-index: 1;">
                <tr style="white-space: nowrap;">
                  <th scope="col">No</th>
                  <th scope="col">Barcode</th>
                  <th scope="col">Product Code</th>
                  <th scope="col">Product Name</th>
                  <th scope="col">Product Condition</th>
                  <th scope="col">Information</th>
                  <th scope="col">Match Status</th>
                  <th scope="col">Match Remarks</th>
                  <th scope="col">System Status</th>
                  <th scope="col">Receipt</th>
                  <th scope="col">Vendor</th>
                  <th scope="col">Scanned Date</th>
                </tr>
              </thead>
              <tbody id="stok-opname-tbody">
                <tr>
                  <td colspan="12" class="text-center">Memuat data...</td>
                </tr>
              </tbody>
            </table>
          </div>

          </div>
        </div>
      </div>


      <!-- Modal -->
      <div class="modal fade" id="modalInputWh" tabindex="-1" aria-labelledby="modalInputWhLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="modalInputWhLabel">Input Judul</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <input type="text" class="form-control" id="judulSon" placeholder="Judul">
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-ssi" id="input-stok-opname">Simpan</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ✅ Toast Sukses -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
      <div id="successToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body">Berhasil, tunggu proses loading selesai 👋</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>

      <!-- ❌ Toast Error -->
      <div id="errorToast" class="toast align-items-center text-bg-danger border-0 mt-2" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body">Gagal membuat judul stock opname</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/route.js"></script>
    <script src="../js/index.js"></script>
    <!-- <script src="../js/stok_opname.js"></script> -->
    <script src="../js/detailStokOpname.js"></script>
    <script src="../js/loading.js"></script>
    <script src="../../services/env.js"></script>
  </body>
</html>
