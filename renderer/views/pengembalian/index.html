<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pengembalian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/detail.css">
  </head>

  <body>
    <div class="header-pos">
      <div class="d-flex align-items-center">
        <div class="btn mx-2 btn-ssi" id="to-menu-peminjaman">
          <i class="fa-solid fa-arrow-left"></i>
        </div>
        <h2 class="text-ssi">SSI</h2>
        <div class="border-d"></div>
        <div>
          <table>
            <tr>
              <td>Warehouse</td>
              <td>:</td>
              <td id="head-warehouse">Memuat data...</td>
            </tr>
            <tr>
              <td>Tanggal</td>
              <td>:</td>
              <td id="head-date">Memuat data...</td>
            </tr>
          </table>
        </div>
      </div>
      <div class="text-end">
        <h6 class="mb-2" id="head-warehouse-name">Memuat data...</h6>
        <h6 id="head-vendor">Memuat data...</h6>
      </div>
    </div>
    <div class="container-fluid mt-3">
      <div class="row">
        <div class="col-md-7 mb-5">
          <div class="d-flex justify-content-between">
            <div class="col-md-6 me-2 panel-kanan">
              <h5 class="card-title mb-3 fw-semibold text-secondary border-bottom pb-2">Notes</h5>
              <div class="container-fluid small" id="content-data-detail">
                <div class="text-center text-muted">Memuat data...</div>
              </div>
            </div>
            <div class="col-md-6 panel-kanan">
              <div class="table-responsive" style="max-height: 550px; overflow-y: auto;">
              <table class="table table-sm table-bordered table-hover table-pos mt-0 mb-0">
                <thead id="thead-left" class="table-light" style="position: sticky; top: 0; background: white; z-index: 1;">
                  <tr style="white-space: nowrap;">
                    <th>No</th>
                    <th>Barcode</th>
                    <th>Nama</th>
                    <th>Kondisi</th>
                    <th>Notes</th>
                    <th>Status</th> 
                  </tr>
                </thead>
                <tbody id="tbody-left">
                  <tr>
                    <td colspan="6" class="text-center">Memuat data...</td>
                  </tr>
                </tbody>
              </table>
            </div>
            </div>
          </div>
        </div>

        <div class="col-md-5">
          <div class="">
            <div class="d-flex justify-content-between">
              <div class="d-flex gap-3 mb-3" style="width: 40%;">
                  <div class="input-group">
                      <input type="text" class="form-control" id="scanBarcode" placeholder="Scan Barcode">
                  </div>
                  <button class="btn btn-ssi" type="button" id="addScanBtn">Tambah</button>
              </div>
                <button class="btn btn-outline-success" style="max-height: 40px;" id="btn-validate">Validate</button>
            </div>
            <div class="table-responsive" style="max-height: 550px; overflow-y: auto;">
              <table class="table table-sm table-bordered table-hover table-pos mt-0 mb-0">
                <thead id="thead-right" class="table-light" style="position: sticky; top: 0; background: white; z-index: 1;">
                  <tr style="white-space: nowrap;">
                    <th>No</th>
                    <th>Barcode</th>
                    <th>Nama</th>
                    <th>Status</th>
                    <th>Kondisi</th>
                    <th>Notes</th>
                  </tr>
                </thead>
                <tbody id="tbody-right">
                  <tr>
                    <td colspan="6" class="text-center">Memuat data...</td>
                  </tr>
                </tbody>
              </table>
            </div>
            
          </div>
        </div>
      </div>
    </div>
    <!-- 📝 Modal Catatan (Validate) -->
    <div class="modal fade" id="notesModal" tabindex="-1" aria-labelledby="notesModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="notesModalLabel">Catatan Pengembalian</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
          </div>
          <div class="modal-body">
            <textarea class="form-control" id="returnNotes" rows="4" placeholder="Tulis catatan pengembalian..."></textarea>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
            <button type="button" class="btn btn-success" id="btnSaveNotes">Simpan & Kirim</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ✅ Toast Sukses & Error -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
      <div id="successToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body" id="success-message"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>

      <div id="errorToast" class="toast align-items-center text-bg-danger border-0 mt-2" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body" id="error-message"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
  <script src="../../js/route.js"></script>
  <script src="../../js/pengembalian/index.js"></script>
  <script src="../../../services/env.js"></script>
</html>
