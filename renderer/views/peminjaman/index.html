<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Peminjaman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/detail.css">
  </head>

  <body>
    <div class="header-pos">
      <div class="d-flex align-items-center">
        <div class="btn mx-2 btn-ssi" id="to-menu-peminjaman">
          <i class="fa-solid fa-arrow-left"></i>
        </div>
        <h2 class="text-ssi">SSI</h2>
        <div class="border-d"></div>
      </div>
      <div class="text-end">
        <h6 class="mb-2" id="head-date">Memuat data...</h6>
        <h6 id="account-name">Memuat data...</h6>
      </div>
    </div>
    <div class="container-fluid mt-4 px-5">
      <div class="row justify-content-center g-0">
        <div class="col-md-3">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <h5 class="card-title mb-3 fw-semibold text-secondary">Form Data Diri</h5>
              <div class="mb-2">
                <input type="text" class="form-control" placeholder="Name">
              </div>
              <div class="mb-2">
                <input type="text" class="form-control" placeholder="NIK">
              </div>
              <div class="mb-2">
                <input type="text" class="form-control" placeholder="Phone">
              </div>
              <div class="mb-2">
                <input type="email" class="form-control" placeholder="Email">
              </div>
              <div class="mb-2">
                <input type="text" class="form-control" placeholder="Department">
              </div>
              <div class="mb-2">
                <input type="text" class="form-control" placeholder="Address">
              </div>
              <div class="mb-2">
                <input type="text" class="form-control" placeholder="Warehouse Code">
              </div>
              <div class="mb-3">
                <input type="datetime-local" class="form-control" placeholder="Due Date">
              </div>

              <button class="btn btn-ssi w-100">Tambah</button>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <h5 class="card-title mb-3 fw-semibold text-secondary">Input Data Barang</h5>

              <div class="mb-2">
                <input type="text" class="form-control" placeholder="barcode">
              </div>
              <div class="mb-2">
                <select class="form-select" placeholder="condition">
                  <option value="">-- Pilih Kondisi --</option>
                  <option value="good">Good</option>
                  <option value="damaged">Damaged</option>
                  <option value="missing_parts">Missing Parts</option>
                  <option value="defect">Defect</option>
                </select>
              </div>
              <div class="mb-3">
                <input type="text" class="form-control" placeholder="notes">
              </div>

              <button class="btn btn-ssi w-100">Tambah</button>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="table-responsive" style="max-height: 550px; overflow-y: auto;">
            <table class="table table-sm table-bordered table-hover table-pos mt-0 mb-0">
              <thead id="thead-right" class="table-light" style="position: sticky; top: 0; background: white; z-index: 1;">
                <tr style="white-space: nowrap;">
                  <th>No</th>
                  <th>Barcode</th>
                  <th>Nama</th>
                  <th>Status</th>
                  <th>Kondisi</th>
                  <th>Informasi</th>
                  <th>Opsi</th>
                </tr>
              </thead>
              <tbody id="tbody-right">
                <tr>
                  <td colspan="6" class="text-center">Memuat data...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <!-- FOOTER -->
    <div class="footer-pos mt-2">
      <div class="d-flex justify-content-end mb-5 mt-4">
        <button class="btn btn-outline-dark" id="btn-validate">Validate</button>
      </div>
    </div>
    <!-- ✅ Toast Sukses -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
      <div id="successToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body" id="success-message"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>

      <!-- ❌ Toast Error -->
      <div id="errorToast" class="toast align-items-center text-bg-danger border-0 mt-2" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body" id="error-message"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
  <script src="../../js/route.js"></script>
  <script src="../../js/peminjaman/index.js"></script>
  <script src="../../js/loading.js"></script>
  <script src="../../../services/env.js"></script>
</html>
