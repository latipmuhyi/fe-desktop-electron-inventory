<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delivery Order Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/detail.css">
  </head>

  <body>
    <div class="header-pos">
      <div class="d-flex align-items-center">
        <div class="btn mx-2 btn-ssi" id="to-warehouse-orders">
          <i class="fa-solid fa-arrow-left"></i>
        </div>
        <h2 class="text-ssi">SSI</h2>
        <div class="border-d"></div>
        <div>
          <table>
            <tr>
              <td>Warehouse</td>
              <td>:</td>
              <td id="head-warehouse">Memuat data...</td>
            </tr>
            <tr>
              <td>Tanggal</td>
              <td>:</td>
              <td id="head-date">Memuat data...</td>
            </tr>
          </table>
        </div>
      </div>
      <div class="text-end">
        <h6 class="mb-2" id="head-warehouse-name">Memuat data...</h6>
        <h6 id="head-vendor">Memuat data...</h6>
      </div>
    </div>
    <div class="container-fluid mt-3">
      <div class="row">
        <div class="col-md-4 mb-5">
          <div class="panel-kanan">
            <div class="table-responsive" style="max-height: 550px; overflow-y: auto;">
              <table class="table table-sm table-bordered table-hover table-pos mt-0 mb-0">
                <thead class="table-light" style="position: sticky; top: 0; background: white; z-index: 1;">
                  <tr style="white-space: nowrap;">
                    <th>No</th>
                    <th>Barcode</th>
                    <th>Nama</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="tbody-left">
                  <tr>
                    <td colspan="4" class="text-center">Memuat data...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="col-md-8">
          <div class="">
            <div class="d-flex gap-3 mb-3" style="width: 40%;">
                <div class="input-group">
                    <input type="text" class="form-control" id="scanBarcode" placeholder="Scan Barcode">
                </div>
                <button class="btn btn-ssi" type="button" id="addScanBtn">Tambah</button>
            </div>
            <div class="table-responsive" style="max-height: 550px; overflow-y: auto;">
              <table class="table table-sm table-bordered table-hover table-pos mt-0 mb-0">
                <thead id="thead-right" class="table-light" style="position: sticky; top: 0; background: white; z-index: 1;">
                  <tr style="white-space: nowrap;">
                        <th>No</th>
                        <th>Barcode</th>
                        <th>Nama</th>
                        <th>Code Produk</th>
                        <th>Warehouse</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tbody-right">
                  <tr>
                    <td colspan="6" class="text-center">Memuat data...</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class=" justify-content-end my-5">
          <!-- <p class="mb-0 total">Jumlah Barang = <span class="total" id="count"></span></p> -->
                <button class="btn btn-outline-dark float-end" id="btn-validate">Validate</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="footer-pos mt-2">
      <!-- <div class="d-flex justify-content-between"> -->
        
        <div class="table-responsive" style="max-height: 550px; overflow-y: auto;">
              <table class="table table-sm table-bordered table-hover table-pos mt-0 mb-0">
                <thead id="thead-footer" class="table-light" style="position: sticky; top: 0; background: white; z-index: 1;">
                  <tr style="white-space: nowrap;">
                        <th>No</th>
                        <th>Barcode</th>
                        <th>Nama</th>
                        <th>Code Produk</th>
                        <th>Warehouse</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tbody-footer">
                  <tr>
                    <td colspan="6" class="text-center">Memuat data...</td>
                  </tr>
                </tbody>
              </table>
            </div>
      <!-- </div> -->
    </div>
    <!-- ✅ Toast Sukses -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
      <div id="successToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body" id="success-message">Data Berhasil di Validate</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>

      <!-- ❌ Toast Error -->
      <div id="errorToast" class="toast align-items-center text-bg-danger border-0 mt-2" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body" id="error-message"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
  <script src="../../js/route.js"></script>
  <script src="../../js/delivery-orders/detail.js"></script>
  <script src="../../../services/env.js"></script>
  <script src="../../js/loading.js"></script>
</html>
